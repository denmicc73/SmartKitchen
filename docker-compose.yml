services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME:-smartkitchen}
      MYSQL_USER: ${DB_USER:-smartkitchen}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-smartkitchen}
      DB_USER: ${DB_USER:-smartkitchen}
      DB_PASS: ${DB_PASS}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Smart Kitchen <no-reply@smart-kitchen.local>}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      UPLOADS_DIR: /app/data/uploads
    volumes:
      - uploads_data:/app/data/uploads
    ports:
      - "8080:8080"
    networks:
      - internal
      - default

volumes:
  mysql_data:
  uploads_data:

networks:
  internal:
    internal: true
  default:
