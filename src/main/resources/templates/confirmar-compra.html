<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Confirmar compra')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav('compra')}"></div>

<main class="container">
    <h1>📦 Añadir al inventario</h1>

    <div class="card" style="margin-top:1rem">
        <div class="list__title" style="font-size:1.1rem" th:text="${item.nombre}">Producto</div>
        <div class="list__sub" th:text="${item.cantidad} + ' ' + ${item.unidad}">1 ud</div>

        <form th:action="@{/lista-compra/{id}/confirmar-compra(id=${item.id})}" method="post"
              style="margin-top:1rem">
            <label class="field">
                <span>Fecha de caducidad (opcional)</span>
                <input type="date" name="fechaCaducidad">
            </label>
            <div class="btn-row">
                <button type="submit" class="btn btn--primary btn--lg">Añadir al inventario</button>
                <a th:href="@{/lista-compra}" class="btn">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
