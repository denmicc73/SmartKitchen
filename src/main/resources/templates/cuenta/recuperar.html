<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña · Smart Kitchen</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="login-body">
    <div class="login-card">
        <h1>🔑</h1>
        <p class="subtitle">Recuperar contraseña</p>
        <p class="subtitle">
            Escribe tu correo y te enviaremos un enlace para crear una nueva contraseña.
        </p>

        <form th:action="@{/recuperar}" method="post">
            <label class="field">
                Correo
                <input type="email" name="email" required autofocus autocomplete="email">
            </label>
            <button type="submit" class="btn btn--primary btn--block btn--lg">Enviar enlace</button>
        </form>

        <p th:if="${error}" class="error" th:text="${error}"></p>
        <p class="login-links">
            <a th:href="@{/login}">Volver</a>
        </p>
    </div>
</body>
</html>
