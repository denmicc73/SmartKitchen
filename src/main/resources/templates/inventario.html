<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inventario')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container">
    <h1>Inventario</h1>

    <section th:if="${#lists.size(avisos) > 0}">
        <ul class="lista-avisos">
            <li th:each="a : ${avisos}" class="aviso">
                <div class="aviso-texto">
                    <strong th:text="${a.nombre}">Nombre</strong> caduca pronto
                </div>
                <div class="aviso-pregunta">
                    <span>¿Añadir a la lista de la compra?</span>
                    <form th:action="@{/lista-compra/desde-alimento/{id}(id=${a.id})}" method="post" style="display:inline;">
                        <input type="hidden" name="volver" value="/inventario">
                        <button type="submit" class="button-si">Sí</button>
                    </form>
                    <button type="button" class="button-no" onclick="this.closest('.aviso').remove()">No</button>
                </div>
            </li>
        </ul>
    </section>

    <div class="tabs">
        <a th:href="@{/inventario}" th:classappend="${zonaSeleccionada == null} ? 'active'">Todas</a>
        <a th:each="z : ${zonas}"
           th:href="@{/inventario(zona=${z})}"
           th:classappend="${zonaSeleccionada == z} ? 'active'"
           th:text="${z}">Zona</a>
    </div>

    <table class="tabla">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Zona</th>
            <th>Cantidad</th>
            <th>Caduca</th>
            <th>Días</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${alimentos}"
            th:classappend="${a.diasParaCaducar != null and a.diasParaCaducar <= 3} ? 'fila-alerta'">
            <td data-label="Nombre" th:text="${a.nombre}">Nombre</td>
            <td data-label="Zona" th:text="${a.zona}">Zona</td>
            <td data-label="Cantidad" th:text="${a.cantidad} + ' ' + ${a.unidad}">Cantidad</td>
            <td data-label="Caduca" th:text="${a.fechaCaducidad} ?: '—'">Fecha</td>
            <td data-label="Días" th:text="${a.diasParaCaducar} ?: '—'">Días</td>
            <td data-label="">
                <form th:action="@{/inventario/{id}/eliminar(id=${a.id})}" method="post">
                    <button type="submit" class="link-button">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(alimentos)}">
            <td colspan="6">No hay alimentos en esta zona todavía.</td>
        </tr>
        </tbody>
    </table>

    <h2>Añadir alimento</h2>
    <form th:action="@{/inventario}" th:object="${nuevoAlimento}" method="post" class="form-grid">
        <label>
            Nombre
            <input type="text" th:field="*{nombre}" required>
        </label>
        <label>
            Zona
            <select th:field="*{zona}" required>
                <option th:each="z : ${zonas}" th:value="${z}" th:text="${z}">Zona</option>
            </select>
        </label>
        <label>
            Cantidad
            <input type="number" step="0.01" th:field="*{cantidad}" value="1">
        </label>
        <label>
            Unidad
            <input type="text" th:field="*{unidad}" value="unidad">
        </label>
        <label>
            Fecha de caducidad
            <input type="date" th:field="*{fechaCaducidad}">
        </label>
        <label>
            Código NFC (opcional)
            <input type="text" th:field="*{codigoNfc}">
        </label>
        <button type="submit" class="button">Añadir</button>
    </form>
</main>
</body>
</html>
