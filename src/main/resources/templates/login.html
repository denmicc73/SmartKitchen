<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Smart Kitchen</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="login-body">
    <div class="login-card">
        <h1>🍽️ Smart Kitchen</h1>
        <p class="subtitle">Acceso privado — solo personas autorizadas</p>

        <form th:action="@{/login}" method="post">
            <label>
                Usuario
                <input type="text" name="username" required autofocus>
            </label>
            <label>
                Contraseña
                <input type="password" name="password" required>
            </label>
            <button type="submit">Entrar</button>
        </form>

        <p th:if="${param.error}" class="error">Usuario o contraseña incorrectos.</p>
        <p th:if="${param.logout}" class="info">Sesión cerrada correctamente.</p>
    </div>
</body>
</html>
