<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Smart Kitchen</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="login-body">
    <div class="login-card">
        <h1>🍽️ Smart Kitchen</h1>
        <p class="subtitle">Acceso privado — solo personas autorizadas</p>

        <form th:action="@{/login}" method="post">
            <label class="field">
                Usuario
                <input type="text" name="username" required autofocus autocomplete="username">
            </label>
            <label class="field">
                Contraseña
                <input type="password" name="password" required autocomplete="current-password">
            </label>
            <button type="submit" class="btn btn--primary btn--block btn--lg">Entrar</button>
        </form>

        <p th:if="${param.error}" class="error">Usuario o contraseña incorrectos.</p>
        <p th:if="${param.logout}" class="info">Sesión cerrada correctamente.</p>
        <p th:if="${error}" class="error" th:text="${error}"></p>
        <p th:if="${info}" class="info" th:text="${info}"></p>

        <p class="login-links">
            <a th:href="@{/registro}">Crear cuenta</a>
            <span aria-hidden="true">·</span>
            <a th:href="@{/recuperar}">He olvidado mi contraseña</a>
        </p>
    </div>
</body>
</html>
