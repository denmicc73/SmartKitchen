spring:
  application:
    name: smart-kitchen
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Ficheros opcionales con secretos, fuera del repositorio (ver *.example):
  #   ~/.smart-kitchen/smtp.properties  -> credenciales de correo
  #   ~/.smart-kitchen/ia.properties    -> ANTHROPIC_API_KEY para la IA
  # Si no existen, la app arranca igual (sin correo / sin IA).
  config:
    import:
      - "optional:file:${SMARTKITCHEN_HOME:${user.home}/.smart-kitchen}/smtp.properties"
      - "optional:file:${SMARTKITCHEN_HOME:${user.home}/.smart-kitchen}/ia.properties"
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  # Envio de correo (confirmacion de cuenta y reseteo de contrasena).
  # La app SOLO envia de verdad si hay SMTP_USER y SMTP_PASS. Sin ellos escribe
  # el enlace en el log (modo desarrollo). El host por defecto es Gmail.
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

smartkitchen:
  # URL publica base, usada para construir los enlaces de los correos.
  base-url: ${BASE_URL:http://localhost:8080}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:changeme123}
    # Correo personal del administrador. Se guarda en la cuenta admin para poder
    # recuperar su contrasena desde "He olvidado mi contrasena".
    email: ${ADMIN_EMAIL:}
  mail:
    # Remitente de los correos. Con Gmail debe ser tu propia direccion (o un
    # alias verificado), por eso por defecto usa el usuario SMTP.
    from: ${MAIL_FROM:${SMTP_USER:Smart Kitchen <no-reply@smart-kitchen.local>}}
  uploads:
    # Carpeta absoluta (independiente del directorio de arranque) para no
    # perder de vista las imagenes segun desde donde se lance la app.
    dir: ${UPLOADS_DIR:${SMARTKITCHEN_HOME:${user.home}/.smart-kitchen}/uploads}
  ia:
    api-key: ${ANTHROPIC_API_KEY:}
    modelo: ${ANTHROPIC_MODEL:claude-sonnet-4-6}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Ruta ABSOLUTA para que siempre sea la misma base de datos, se lance la app
    # desde donde se lance (IntelliJ, Maven, terminal...). Antes era "./data/..."
    # y creaba una BD distinta segun el directorio de trabajo.
    url: jdbc:h2:file:${SMARTKITCHEN_HOME:${user.home}/.smart-kitchen}/db/smartkitchen;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  thymeleaf:
    cache: true
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:smartkitchen}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: never

server:
  forward-headers-strategy: framework

smartkitchen:
  base-url: ${BASE_URL:http://localhost:8080}
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    email: ${ADMIN_EMAIL:}

---
# ---------------------------------------------------------------------------
# Perfil "render": despliegue en Render (u otro PaaS) con PostgreSQL gestionado.
# Se activa poniendo la variable de entorno  SPRING_PROFILES_ACTIVE=render
#
# La conexion a la base de datos se toma de las variables estandar de Spring
# Boot (las rellenas en el panel de Render con los datos de tu PostgreSQL):
#   SPRING_DATASOURCE_URL       jdbc:postgresql://<host>:5432/<base>
#   SPRING_DATASOURCE_USERNAME  <usuario>
#   SPRING_DATASOURCE_PASSWORD  <password>
# El driver y el dialecto los deduce Spring Boot de la URL; no hay que fijarlos.
#
# Los perfiles "dev" (H2) y "prod" (MySQL/Docker) quedan intactos.
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: render
  thymeleaf:
    cache: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never

server:
  # Render inyecta la variable PORT (normalmente 10000) y espera que la app
  # escuche ahi. Si no existe, se usa 8080 (util para probar en local).
  port: ${PORT:8080}
  # Render termina el HTTPS en su proxy: sin esto los enlaces que genera la app
  # saldrian como http:// y el login por sesion puede fallar tras el proxy.
  forward-headers-strategy: framework

smartkitchen:
  # URL publica real del servicio en Render. Se usa para los enlaces de los
  # correos de confirmacion y de reseteo de contrasena.
  base-url: ${BASE_URL:http://localhost:8080}
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    email: ${ADMIN_EMAIL:}
